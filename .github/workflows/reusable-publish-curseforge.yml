name: reusable CurseForge publication

on:
  workflow_call:
    inputs:
      runner:
        description: JSON runs-on value, a runner label or an array of labels
        required: false
        default: '"ubuntu-24.04"'
        type: string
      artifact_file:
        description: Exact release JAR file name from release preparation
        required: true
        type: string
      release_body:
        description: Release notes shared across destinations
        required: true
        type: string
      java_version:
        description: JDK version used by the Fabric build
        required: false
        default: '25'
        type: string
      project_id:
        description: CurseForge numeric project id
        required: true
        type: string
      project_slug:
        description: CurseForge project slug
        required: false
        default: ''
        type: string
      gradle_task:
        description: Gradle task that publishes this artifact to CurseForge
        required: false
        default: publishCurseforge
        type: string
      prepare_baritone:
        description: Build the required local Baritone fork before the consumer
        required: false
        default: false
        type: boolean
      prepare_siblings:
        description: Space-separated brainage04 repositories to clone into ../<name> and publish to their build/local-repo before the consumer
        required: false
        default: ''
        type: string
    secrets:
      curseforge_token:
        description: CurseForge API token
        required: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ${{ fromJSON(inputs.runner) }}
    steps:
      - name: check CurseForge configuration
        id: config
        env:
          CURSEFORGE_PROJECT_ID: ${{ inputs.project_id }}
          CURSEFORGE_TOKEN: ${{ secrets.curseforge_token }}
        run: |
          if [ -z "${CURSEFORGE_TOKEN}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping CurseForge publication because its token is not configured."
          elif [ -z "${CURSEFORGE_PROJECT_ID}" ]; then
            echo "Missing CurseForge project id."
            exit 1
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: checkout repository
        if: steps.config.outputs.enabled == 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: remove stale sibling checkouts
        if: steps.config.outputs.enabled == 'true'
        shell: bash
        run: |
          # Self-hosted runners keep their work tree between jobs; a leftover sibling such as
          # ../FabricModdingConventions would be picked up by settings.gradle's includeBuild.
          checkout="$(basename "${GITHUB_WORKSPACE}")"
          find "${GITHUB_WORKSPACE}/.." -mindepth 1 -maxdepth 1 ! -name "${checkout}" -exec rm -rf -- {} +

      - name: validate gradle wrapper
        if: steps.config.outputs.enabled == 'true'
        uses: gradle/actions/wrapper-validation@v5

      - name: setup jdk
        if: steps.config.outputs.enabled == 'true'
        uses: actions/setup-java@v5
        with:
          java-version: ${{ inputs.java_version }}
          distribution: microsoft

      - name: setup gradle
        if: steps.config.outputs.enabled == 'true'
        uses: gradle/actions/setup-gradle@v5

      - name: prepare required local Baritone fork
        if: steps.config.outputs.enabled == 'true' && inputs.prepare_baritone
        run: |
          MINECRAFT_VERSION="$(sed -n 's/^minecraft_version=//p' gradle.properties)"
          rm -rf ../baritone
          git clone --depth 1 --branch "minecraft-${MINECRAFT_VERSION}" https://github.com/brainage04/baritone.git ../baritone
          chmod +x ../baritone/gradlew
          ../baritone/gradlew -p ../baritone \
            --no-daemon \
            -Pmaven_group=io.github.brainage04 \
            publishAllPublicationsToLocalBaritoneRepository

      - name: prepare sibling libraries
        if: steps.config.outputs.enabled == 'true' && inputs.prepare_siblings != ''
        env:
          PREPARE_SIBLINGS: ${{ inputs.prepare_siblings }}
        run: |
          for name in ${PREPARE_SIBLINGS}; do
            if [[ ! "${name}" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "Invalid sibling repository name: ${name}"
              exit 1
            fi
            rm -rf "../${name}"
            git clone --depth 1 "https://github.com/brainage04/${name}.git" "../${name}"
            chmod +x "../${name}/gradlew"
            "../${name}/gradlew" -p "../${name}" --no-daemon publishAllPublicationsToLocalRepository
          done

      - name: make gradle wrapper executable
        if: steps.config.outputs.enabled == 'true'
        run: chmod +x ./gradlew

      - name: download exact release artifact
        if: steps.config.outputs.enabled == 'true'
        uses: actions/download-artifact@v7
        with:
          name: release-artifact
          path: release-artifacts

      - name: publish CurseForge file
        if: steps.config.outputs.enabled == 'true'
        env:
          CURSEFORGE_TOKEN: ${{ secrets.curseforge_token }}
          GRADLE_TASK: ${{ inputs.gradle_task }}
          MOD_PUBLISHING_RELEASE_JAR: release-artifacts/${{ inputs.artifact_file }}
          RELEASE_BODY: ${{ inputs.release_body }}
          RELEASE_PRERELEASE: ${{ contains(github.ref_name, '-') }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          ./gradlew "${GRADLE_TASK}"
          -PpublishCurseforge=true
          -PcurseforgeProjectId=${{ inputs.project_id }}
          -PcurseforgeProjectSlug=${{ inputs.project_slug }}
