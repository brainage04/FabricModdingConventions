name: reusable client GameTests

on:
  workflow_call:
    inputs:
      runner:
        description: JSON runs-on value, a runner label or an array of labels
        required: false
        default: '"ubuntu-24.04"'
        type: string
      java_version:
        description: JDK version used by the Fabric build
        required: false
        default: '25'
        type: string
      run_client_gametests:
        description: Run the non-recorded client GameTest suite
        required: false
        default: true
        type: boolean
      client_gametest_profile:
        description: Optional profile exposed to the non-recorded client run
        required: false
        default: ''
        type: string
      record_client_gametests:
        description: Record a client GameTest profile
        required: false
        default: false
        type: boolean
      recording_profile:
        description: Optional profile exposed to the recorded client run
        required: false
        default: ''
        type: string
      recording_trace:
        description: Request trace metadata during the recorded run
        required: false
        default: false
        type: boolean
      timeout_minutes:
        description: Time limit in minutes of each step that runs Gradle
        required: false
        default: 40
        type: number
      prepare_baritone:
        description: Build the required local Baritone fork before the consumer
        required: false
        default: false
        type: boolean
      prepare_siblings:
        description: Space-separated brainage04 repositories to clone into ../<name> and publish to their build/local-repo before the consumer
        required: false
        default: ''
        type: string
      git_ssh_repositories:
        description: Space-separated brainage04 repositories whose HTTPS clone URL, https://github.com/brainage04/<name>.git, is cloned over SSH with the git_ssh_key secret during this job; required with git_ssh_key
        required: false
        default: ''
        type: string
    secrets:
      git_ssh_key:
        description: Optional read-only SSH deploy key for private repositories the build clones, such as gitMod repositories
        required: false

permissions:
  contents: read

jobs:
  client-gametests:
    runs-on: ${{ fromJSON(inputs.runner) }}
    # The job's own limit also covers the time a self-hosted runner holds the job before it runs anything, for example
    # waiting for capacity in a job-started hook; the steps that run Gradle have timeout_minutes each.
    timeout-minutes: 360
    steps:
      - name: checkout repository
        uses: actions/checkout@v5

      - name: remove stale sibling checkouts
        shell: bash
        run: |
          # Self-hosted runners keep their work tree between jobs; a leftover sibling such as
          # ../FabricModdingConventions would be picked up by settings.gradle's includeBuild.
          checkout="$(basename "${GITHUB_WORKSPACE}")"
          find "${GITHUB_WORKSPACE}/.." -mindepth 1 -maxdepth 1 ! -name "${checkout}" -exec rm -rf -- {} +

      - name: configure git SSH access
        shell: bash
        env:
          GIT_SSH_KEY: ${{ secrets.git_ssh_key }}
          GIT_SSH_REPOSITORIES: ${{ inputs.git_ssh_repositories }}
        run: |
          # Self-hosted runners keep their home directory between jobs, so the key lives in the job's temp
          # directory and git is configured only through environment variables exported to the later steps
          # (Gradle's gitMod clones from inside Gradle); nothing goes into global git config or ~/.ssh.
          if [ -z "${GIT_SSH_KEY}" ]; then
            exit 0
          fi
          if [ -z "${GIT_SSH_REPOSITORIES}" ]; then
            echo "git_ssh_key needs git_ssh_repositories"
            exit 1
          fi
          for name in ${GIT_SSH_REPOSITORIES}; do
            if [[ ! "${name}" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "Invalid git SSH repository name: ${name}"
              exit 1
            fi
          done
          dir="${RUNNER_TEMP}/git-ssh"
          rm -rf "${dir}"
          (umask 077 && mkdir -p "${dir}" && printf '%s\n' "${GIT_SSH_KEY%$'\n'}" > "${dir}/id")
          chmod 600 "${dir}/id"
          count=0
          {
            echo "GIT_SSH_COMMAND=ssh -i \"${dir}/id\" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=\"${dir}/known_hosts\""
            for name in ${GIT_SSH_REPOSITORIES}; do
              echo "GIT_CONFIG_KEY_${count}=url.git@github.com:brainage04/${name}.git.insteadOf"
              echo "GIT_CONFIG_VALUE_${count}=https://github.com/brainage04/${name}.git"
              count=$((count + 1))
            done
            echo "GIT_CONFIG_COUNT=${count}"
          } >> "${GITHUB_ENV}"

      - name: detect client test support
        id: client-test-support
        shell: bash
        run: |
          MOD_SIDE="$(sed -n 's/^mod_side=//p' gradle.properties)"
          # A repository using the multi-loader conventions never names the recorder plug-in in
          # its own build files: MultiLoaderModConventionsPlugin applies it. Without this
          # alternation every mod_side=server repository silently skipped its client GameTests.
          if grep -R \
            --include='build.gradle' \
            --include='build.gradle.kts' \
            --quiet -e 'io.github.brainage04.client-gametest-recorder' \
                     -e 'io.github.brainage04.multiloader-mod-conventions' .; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          elif [ "$MOD_SIDE" != 'server' ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi
          # Multi-loader builds run the Fabric production client from the fabric project; a
          # single-loader Fabric build runs Loom's development client GameTest at its root.
          if grep -R \
            --include='build.gradle' \
            --include='build.gradle.kts' \
            --quiet -e 'io.github.brainage04.multiloader-mod-conventions' .; then
            echo 'run_task=:fabric:runProductionClientGameTest' >> "$GITHUB_OUTPUT"
            echo 'record_task=:fabric:recordClientGameTest' >> "$GITHUB_OUTPUT"
          else
            echo 'run_task=runClientGameTest' >> "$GITHUB_OUTPUT"
            echo 'record_task=recordClientGameTest' >> "$GITHUB_OUTPUT"
          fi

      - name: install client test tools
        if: steps.client-test-support.outputs.present == 'true'
        env:
          RECORD_CLIENT_GAMETESTS: ${{ inputs.record_client_gametests }}
        run: |
          packages=(xvfb x11-utils mesa-utils libflite1 libgl1-mesa-dri libglx-mesa0 libxi6 libxrandr2 libxrender1 libxtst6 libxinerama1 libxcursor1 libxxf86vm1)
          if [ "${RECORD_CLIENT_GAMETESTS}" = 'true' ]; then
            packages+=(ffmpeg pipewire-bin)
          fi
          sudo apt-get update
          sudo apt-get install -y "${packages[@]}"

      - name: validate gradle wrapper
        if: steps.client-test-support.outputs.present == 'true'
        uses: gradle/actions/wrapper-validation@v5

      - name: setup jdk
        if: steps.client-test-support.outputs.present == 'true'
        uses: actions/setup-java@v5
        with:
          java-version: ${{ inputs.java_version }}
          distribution: microsoft

      - name: setup gradle
        if: steps.client-test-support.outputs.present == 'true'
        uses: gradle/actions/setup-gradle@v5

      - name: prepare required local Baritone fork
        timeout-minutes: ${{ inputs.timeout_minutes }}
        if: steps.client-test-support.outputs.present == 'true' && inputs.prepare_baritone
        run: |
          MINECRAFT_VERSION="$(sed -n 's/^minecraft_version=//p' gradle.properties)"
          rm -rf ../baritone
          git clone --depth 1 --branch "minecraft-${MINECRAFT_VERSION}" https://github.com/brainage04/baritone.git ../baritone
          chmod +x ../baritone/gradlew
          ../baritone/gradlew -p ../baritone \
            --no-daemon \
            -Pmaven_group=io.github.brainage04 \
            publishAllPublicationsToLocalBaritoneRepository

      - name: prepare sibling libraries
        timeout-minutes: ${{ inputs.timeout_minutes }}
        if: steps.client-test-support.outputs.present == 'true' && inputs.prepare_siblings != ''
        env:
          PREPARE_SIBLINGS: ${{ inputs.prepare_siblings }}
        run: |
          for name in ${PREPARE_SIBLINGS}; do
            if [[ ! "${name}" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "Invalid sibling repository name: ${name}"
              exit 1
            fi
            rm -rf "../${name}"
            git clone --depth 1 "https://github.com/brainage04/${name}.git" "../${name}"
            chmod +x "../${name}/gradlew"
            "../${name}/gradlew" -p "../${name}" --no-daemon publishAllPublicationsToLocalRepository
          done

      - name: make gradle wrapper executable
        if: steps.client-test-support.outputs.present == 'true'
        run: chmod +x ./gradlew

      - name: run client GameTests
        timeout-minutes: ${{ inputs.timeout_minutes }}
        if: steps.client-test-support.outputs.present == 'true' && inputs.run_client_gametests
        env:
          ALSOFT_DRIVERS: 'null'
          LIBGL_ALWAYS_SOFTWARE: '1'
          REQUESTED_CLIENT_GAMETEST_PROFILE: ${{ inputs.client_gametest_profile }}
          GRADLE_TASK: ${{ steps.client-test-support.outputs.run_task }}
        run: |
          if [ -n "$REQUESTED_CLIENT_GAMETEST_PROFILE" ]; then
            export CLIENT_GAMETEST_PROFILE="$REQUESTED_CLIENT_GAMETEST_PROFILE"
          fi
          xvfb-run -a --server-args="-screen 0 1280x720x24" ./gradlew --no-daemon "${GRADLE_TASK}"

      - name: record client GameTests
        timeout-minutes: ${{ inputs.timeout_minutes }}
        if: steps.client-test-support.outputs.present == 'true' && inputs.record_client_gametests
        env:
          ALSOFT_DRIVERS: 'null'
          LIBGL_ALWAYS_SOFTWARE: '1'
          GTR_RECORDING_NAME: ${{ inputs.recording_profile || 'client-gametest' }}
          GTR_RECORDING_PROFILE: ${{ inputs.recording_profile }}
          GTR_RECORDING_TRACE: ${{ inputs.recording_trace && 'true' || 'false' }}
          GRADLE_TASK: ${{ steps.client-test-support.outputs.record_task }}
        run: ./gradlew --no-daemon "${GRADLE_TASK}"

      - name: store client GameTest recordings
        if: always() && steps.client-test-support.outputs.present == 'true' && inputs.record_client_gametests
        uses: actions/upload-artifact@v7
        with:
          retention-days: 3
          name: client-gametest-recordings
          path: build/recordings/

      - name: store client GameTest reports
        if: failure() && steps.client-test-support.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          retention-days: 3
          name: client-gametest-reports
          path: |
            **/build/reports/
            **/build/test-results/
            **/build/run/clientGameTest/logs/

      - name: remove git SSH key
        if: always()
        shell: bash
        run: rm -rf "${RUNNER_TEMP}/git-ssh"
