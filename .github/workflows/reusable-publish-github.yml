name: reusable GitHub publication

on:
  workflow_call:
    inputs:
      runner:
        description: JSON runs-on value, a runner label or an array of labels
        required: false
        default: '"ubuntu-24.04"'
        type: string
      artifact_file:
        description: Exact release JAR file name from release preparation
        required: true
        type: string
      additional_artifact_file:
        description: Optional second release JAR file name from release preparation
        required: false
        default: ''
        type: string
      release_body:
        description: Release notes shared across destinations
        required: true
        type: string
      java_version:
        description: JDK version used by the Fabric build
        required: false
        default: '25'
        type: string
      publish_with_gradle:
        description: Publish through the mod-publishing Gradle task
        required: false
        default: true
        type: boolean
      release_name:
        description: Release title used by the bootstrap publisher
        required: false
        default: ''
        type: string
      prepare_baritone:
        description: Build the required local Baritone fork before the Gradle publication
        required: false
        default: false
        type: boolean
    secrets:
      release_token:
        description: GitHub token with contents write permission
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ${{ fromJSON(inputs.runner) }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: ${{ inputs.java_version }}
          distribution: microsoft

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v5

      - name: prepare required local Baritone fork
        if: inputs.publish_with_gradle && inputs.prepare_baritone
        run: |
          MINECRAFT_VERSION="$(sed -n 's/^minecraft_version=//p' gradle.properties)"
          rm -rf ../baritone
          git clone --depth 1 --branch "minecraft-${MINECRAFT_VERSION}" https://github.com/brainage04/baritone.git ../baritone
          chmod +x ../baritone/gradlew
          ../baritone/gradlew -p ../baritone \
            --no-daemon \
            -Pmaven_group=io.github.brainage04 \
            publishAllPublicationsToLocalBaritoneRepository

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: download exact release artifact
        uses: actions/download-artifact@v7
        with:
          name: release-artifact
          path: release-artifacts

      - name: validate GitHub publication mode
        if: inputs.publish_with_gradle && inputs.additional_artifact_file != ''
        run: |
          echo "Gradle GitHub publication supports one release artifact; use bootstrap publication for multiple artifacts."
          exit 1

      - name: publish GitHub release
        if: inputs.publish_with_gradle
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.release_token }}
          MOD_PUBLISHING_RELEASE_JAR: release-artifacts/${{ inputs.artifact_file }}
          RELEASE_BODY: ${{ inputs.release_body }}
          RELEASE_PRERELEASE: ${{ contains(github.ref_name, '-') }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./gradlew publishGithub -PpublishGithub=true
      - name: publish bootstrap GitHub release
        if: ${{ !inputs.publish_with_gradle }}
        env:
          ARTIFACT_FILE: release-artifacts/${{ inputs.artifact_file }}
          ADDITIONAL_ARTIFACT_FILE: ${{ inputs.additional_artifact_file }}
          GH_TOKEN: ${{ secrets.release_token }}
          RELEASE_BODY: ${{ inputs.release_body }}
          RELEASE_NAME: ${{ inputs.release_name }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          TITLE="${RELEASE_NAME:-${RELEASE_TAG}}"
          printf '%s\n' "${RELEASE_BODY}" > "${RUNNER_TEMP}/release-notes.md"
          ARTIFACTS=("${ARTIFACT_FILE}")
          if [ -n "${ADDITIONAL_ARTIFACT_FILE}" ]; then
            ARTIFACTS+=("release-artifacts/${ADDITIONAL_ARTIFACT_FILE}")
          fi
          PRERELEASE_ARGUMENT=()
          if [[ "${RELEASE_TAG}" == *-* ]]; then
            PRERELEASE_ARGUMENT+=(--prerelease)
          fi
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${TITLE}" \
              --notes-file "${RUNNER_TEMP}/release-notes.md"
            gh release upload "${RELEASE_TAG}" \
              "${ARTIFACTS[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${RELEASE_TAG}" \
              "${ARTIFACTS[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${TITLE}" \
              --notes-file "${RUNNER_TEMP}/release-notes.md" \
              --verify-tag \
              "${PRERELEASE_ARGUMENT[@]}"
          fi
