name: reusable multi-loader mod build

on:
  workflow_call:
    inputs:
      runner:
        description: JSON runs-on value, a runner label or an array of labels
        required: false
        default: '"ubuntu-24.04"'
        type: string
      java_version:
        description: JDK version used by the multi-loader build
        required: false
        default: '25'
        type: string
      gradle_task:
        description: Gradle tasks and arguments of the build step; multi-loader builds whose production GameTest job runs :fabric:runGameTest pass 'build -x :fabric:runGameTest' so the build job does not run that suite again
        required: false
        default: build
        type: string
      timeout_minutes:
        description: Time limit in minutes of each step that runs Gradle
        required: false
        default: 20
        type: number
      check_scripts:
        description: Run shellcheck and shfmt against repository scripts
        required: false
        default: false
        type: boolean
      run_template_smoke:
        description: Run the generated-template smoke matrix
        required: false
        default: false
        type: boolean
      prepare_baritone:
        description: Build the required local Baritone fork before the consumer
        required: false
        default: false
        type: boolean
      prepare_siblings:
        description: Space-separated brainage04 repositories to clone into ../<name> and publish to their build/local-repo before the consumer
        required: false
        default: ''
        type: string
      git_ssh_repositories:
        description: Space-separated brainage04 repositories whose HTTPS clone URL, https://github.com/brainage04/<name>.git, is cloned over SSH with the git_ssh_key secret during this job; required with git_ssh_key
        required: false
        default: ''
        type: string
    secrets:
      git_ssh_key:
        description: Optional read-only SSH deploy key for private repositories the build clones, such as gitMod repositories
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ fromJSON(inputs.runner) }}
    # The job's own limit also covers the time a self-hosted runner holds the job before it runs anything, for example
    # waiting for capacity in a job-started hook; the steps that run Gradle have timeout_minutes each.
    timeout-minutes: 360
    steps:
      - name: checkout repository
        uses: actions/checkout@v5

      - name: remove stale sibling checkouts
        shell: bash
        run: |
          # Self-hosted runners keep their work tree between jobs; a leftover sibling such as
          # ../FabricModdingConventions would be picked up by settings.gradle's includeBuild.
          checkout="$(basename "${GITHUB_WORKSPACE}")"
          find "${GITHUB_WORKSPACE}/.." -mindepth 1 -maxdepth 1 ! -name "${checkout}" -exec rm -rf -- {} +

      - name: configure git SSH access
        shell: bash
        env:
          GIT_SSH_KEY: ${{ secrets.git_ssh_key }}
          GIT_SSH_REPOSITORIES: ${{ inputs.git_ssh_repositories }}
        run: |
          # Self-hosted runners keep their home directory between jobs, so the key lives in the job's temp
          # directory and git is configured only through environment variables exported to the later steps
          # (Gradle's gitMod clones from inside Gradle); nothing goes into global git config or ~/.ssh.
          if [ -z "${GIT_SSH_KEY}" ]; then
            exit 0
          fi
          if [ -z "${GIT_SSH_REPOSITORIES}" ]; then
            echo "git_ssh_key needs git_ssh_repositories"
            exit 1
          fi
          for name in ${GIT_SSH_REPOSITORIES}; do
            if [[ ! "${name}" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "Invalid git SSH repository name: ${name}"
              exit 1
            fi
          done
          dir="${RUNNER_TEMP}/git-ssh"
          rm -rf "${dir}"
          (umask 077 && mkdir -p "${dir}" && printf '%s\n' "${GIT_SSH_KEY%$'\n'}" > "${dir}/id")
          chmod 600 "${dir}/id"
          count=0
          {
            echo "GIT_SSH_COMMAND=ssh -i \"${dir}/id\" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=\"${dir}/known_hosts\""
            for name in ${GIT_SSH_REPOSITORIES}; do
              echo "GIT_CONFIG_KEY_${count}=url.git@github.com:brainage04/${name}.git.insteadOf"
              echo "GIT_CONFIG_VALUE_${count}=https://github.com/brainage04/${name}.git"
              count=$((count + 1))
            done
            echo "GIT_CONFIG_COUNT=${count}"
          } >> "${GITHUB_ENV}"

      - name: install workflow tools
        if: inputs.check_scripts || inputs.run_template_smoke
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq ripgrep shellcheck shfmt tar

      - name: install actionlint
        if: inputs.check_scripts
        env:
          ACTIONLINT_VERSION: '1.7.12'
        run: |
          curl -sSLo /tmp/actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo install -m 0755 /tmp/actionlint /usr/local/bin/actionlint

      - name: check scripts and workflows
        if: inputs.check_scripts
        shell: bash
        run: |
          shopt -s nullglob
          scripts=(.github/scripts/*.sh)
          if [ -f init.sh ]; then
            scripts+=(init.sh)
          fi
          if [ "${#scripts[@]}" -gt 0 ]; then
            shellcheck "${scripts[@]}"
            shfmt -d -i 2 -ci "${scripts[@]}"
          fi
          actionlint

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: ${{ inputs.java_version }}
          distribution: microsoft

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v5

      - name: prepare required local Baritone fork
        timeout-minutes: ${{ inputs.timeout_minutes }}
        if: inputs.prepare_baritone
        run: |
          MINECRAFT_VERSION="$(sed -n 's/^minecraft_version=//p' gradle.properties)"
          rm -rf ../baritone
          git clone --depth 1 --branch "minecraft-${MINECRAFT_VERSION}" https://github.com/brainage04/baritone.git ../baritone
          chmod +x ../baritone/gradlew
          ../baritone/gradlew -p ../baritone \
            --no-daemon \
            -Pmaven_group=io.github.brainage04 \
            publishAllPublicationsToLocalBaritoneRepository

      - name: prepare sibling libraries
        timeout-minutes: ${{ inputs.timeout_minutes }}
        if: inputs.prepare_siblings != ''
        env:
          PREPARE_SIBLINGS: ${{ inputs.prepare_siblings }}
        run: |
          for name in ${PREPARE_SIBLINGS}; do
            if [[ ! "${name}" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "Invalid sibling repository name: ${name}"
              exit 1
            fi
            rm -rf "../${name}"
            git clone --depth 1 "https://github.com/brainage04/${name}.git" "../${name}"
            chmod +x "../${name}/gradlew"
            "../${name}/gradlew" -p "../${name}" --no-daemon publishAllPublicationsToLocalRepository
          done

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        timeout-minutes: ${{ inputs.timeout_minutes }}
        run: ./gradlew --no-daemon ${{ inputs.gradle_task }}

      - name: prepare template smoke dependencies
        timeout-minutes: ${{ inputs.timeout_minutes }}
        if: inputs.run_template_smoke
        run: |
          rm -rf ../FabricModdingConventions
          git clone --depth 1 https://github.com/brainage04/FabricModdingConventions.git ../FabricModdingConventions
          chmod +x ../FabricModdingConventions/gradlew
          ../FabricModdingConventions/gradlew -p ../FabricModdingConventions \
            --no-daemon \
            publishAllPublicationsToLocalRepository

      - name: smoke test generated templates
        timeout-minutes: ${{ inputs.timeout_minutes }}
        if: inputs.run_template_smoke
        run: bash .github/scripts/smoke_template_generation.sh

      - name: store reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          retention-days: 3
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/

      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          retention-days: 3
          name: Artifacts
          path: build/libs/

      - name: remove git SSH key
        if: always()
        shell: bash
        run: rm -rf "${RUNNER_TEMP}/git-ssh"
