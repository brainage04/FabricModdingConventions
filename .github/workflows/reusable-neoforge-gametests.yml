name: reusable NeoForge GameTests

on:
  workflow_call:
    inputs:
      runner:
        description: JSON runs-on value, a runner label or an array of labels
        required: false
        default: '"ubuntu-24.04"'
        type: string
      java_version:
        description: JDK version used by the NeoForge build
        required: false
        default: '25'
        type: string
      gradle_task:
        description: NeoForge GameTest server task
        required: false
        default: :neoforge:runGameTestServer
        type: string
      prepare_baritone:
        description: Build the required local Baritone fork before the consumer
        required: false
        default: false
        type: boolean
      prepare_siblings:
        description: Space-separated brainage04 repositories to clone into ../<name> and publish to their build/local-repo before the consumer
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  neoforge-gametests:
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 20
    steps:
      - name: checkout repository
        uses: actions/checkout@v5

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: ${{ inputs.java_version }}
          distribution: microsoft

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v5

      - name: prepare required local Baritone fork
        if: inputs.prepare_baritone
        run: |
          MINECRAFT_VERSION="$(sed -n 's/^minecraft_version=//p' gradle.properties)"
          rm -rf ../baritone
          git clone --depth 1 --branch "minecraft-${MINECRAFT_VERSION}" https://github.com/brainage04/baritone.git ../baritone
          chmod +x ../baritone/gradlew
          ../baritone/gradlew -p ../baritone \
            --no-daemon \
            -Pmaven_group=io.github.brainage04 \
            publishAllPublicationsToLocalBaritoneRepository

      - name: prepare sibling libraries
        if: inputs.prepare_siblings != ''
        env:
          PREPARE_SIBLINGS: ${{ inputs.prepare_siblings }}
        run: |
          for name in ${PREPARE_SIBLINGS}; do
            if [[ ! "${name}" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "Invalid sibling repository name: ${name}"
              exit 1
            fi
            rm -rf "../${name}"
            git clone --depth 1 "https://github.com/brainage04/${name}.git" "../${name}"
            chmod +x "../${name}/gradlew"
            "../${name}/gradlew" -p "../${name}" --no-daemon publishAllPublicationsToLocalRepository
          done

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: run NeoForge GameTests
        env:
          GRADLE_TASK: ${{ inputs.gradle_task }}
        run: ./gradlew --no-daemon --refresh-dependencies "${GRADLE_TASK}"

      - name: store NeoForge GameTest reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          retention-days: 3
          name: neoforge-gametest-reports
          path: |
            **/build/reports/
            **/build/test-results/
            **/run/gametest/logs/
