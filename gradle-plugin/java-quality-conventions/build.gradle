plugins {
	id 'java-gradle-plugin'
	id 'io.github.brainage04.maven-central-publishing' version "${maven_central_publishing_version}"
}

ext {
	componentArchivesName = "java-quality-conventions-gradle"
	componentPluginId = "io.github.brainage04.java-quality-conventions"
	componentImplementationClass = "io.github.brainage04.fabricmoddingconventions.gradle.quality.JavaQualityConventionsPlugin"
	componentDisplayName = "Java quality conventions Gradle plugin"
	componentDescription = "Configures staged Spotless, Checkstyle, and javac lint policy for Java projects."
}

apply from: rootProject.file("gradle/plugin-component.gradle")

dependencies {
	implementation "com.diffplug.spotless:spotless-plugin-gradle:8.9.0"
}
